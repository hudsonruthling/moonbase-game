<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Moon Base Trade-Offs</title><style>
:root{color-scheme:dark;--bg:#10131f;--panel:#1b2033;--line:#363d5c;--ink:#e8ecf5;--dim:#9aa3c0;--hot:#f2a23a;--ok:#6fd08c;--ice:#6ad4ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-monospace,Menlo,Consolas,monospace}#app{max-width:960px;margin:auto;padding:12px}h1{font-size:16px;color:var(--hot)}canvas{display:block;width:100%;aspect-ratio:320/192;image-rendering:pixelated;border:4px solid #05060c;background:#222}button{font:inherit;color:var(--ink);background:#2a3150;border:2px solid var(--line);padding:8px;cursor:pointer}.a{min-height:60px;text-align:left}.a:disabled{opacity:.5}#acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}#hud{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}.m,#log,#banner{background:var(--panel);border:2px solid var(--line);padding:8px}.m span{display:block;color:var(--dim);font-size:12px}#pad{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}#hint{flex:1;color:var(--ice)}#dp{display:flex;gap:4px}#dp button{width:42px;height:42px}.ov{position:fixed;inset:0;background:#05060cee;overflow:auto;padding:16px;z-index:5}.hidden{display:none!important}.card{max-width:640px;margin:auto;background:var(--panel);border:3px solid var(--line);padding:16px}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:150px}.selected{border-color:var(--hot)}#go{background:var(--ok);color:#07180b;width:100%;margin-top:12px}#end{width:100%;margin:8px 0;background:var(--hot);color:#1a1206}
</style></head><body><main id="app"><h1>Moon Base Trade-Offs</h1><p>Run a moon outpost for 12 days. Every choice costs something else.</p><canvas id="c" width="320" height="192" aria-label="Top-down view of your moon base"></canvas><div id="banner"></div><div id="pad"><div id="hint">Walk with arrows or WASD. Press E or Use near a station.</div><div id="dp"><button data-d="left" aria-label="Left">◀</button><button data-d="up" aria-label="Up">▲</button><button data-d="down" aria-label="Down">▼</button><button data-d="right" aria-label="Right">▶</button><button id="use">Use</button></div></div><div id="hud"></div><div id="crew"></div><div id="acts"></div><button id="end">End the day</button><div id="log"></div></main>
<div class="ov" id="setup"><div class="card"><h2>Plan your mission</h2><p>Keep air, food and power up, keep radiation dose under 100, and complete five science walks in 12 days.</p><h3>Choose your site</h3><div class="row"><button data-site="ridge" class="selected">Sunny ridge</button><button data-site="crater">Crater rim</button></div><button id="go">Launch!</button></div></div>
<script>
'use strict';
const $=s=>document.getElementById(s),c=$('c'),g=c.getContext('2d'),K={};g.imageSmoothingEnabled=false;
const cfg={site:'ridge'},A={air:{n:'Make air',x:256,y:146,p:2},food:{n:'Grow food',x:256,y:84,p:2},science:{n:'Moon walk: science',x:64,y:150,p:1},shield:{n:'Pile moon dirt',x:160,y:46,p:1},call:{n:'Call Earth',x:250,y:54,p:1}};
let S;
$('setup').onclick=e=>{if(e.target.dataset.site){cfg.site=e.target.dataset.site;document.querySelectorAll('[data-site]').forEach(b=>b.classList.toggle('selected',b===e.target))}};
$('go').onclick=()=>{$('setup').classList.add('hidden');start()};
function start(){S={day:1,pow:8,air:60,food:60,dose:0,sci:0,ap:3,panels:1,shield:0,x:160,y:132,dir:2,scene:'out',busy:false,night:false,storm:false,tx:0};ui();requestAnimationFrame(loop)}
function box(x,y,w,h,col,edge='#14141c'){g.fillStyle=edge;g.fillRect(x,y,w,h);g.fillStyle=col;g.fillRect(x+1,y+1,w-2,h-2)}
function draw(t){g.fillStyle=cfg.site==='crater'?'#626a78':'#92918d';g.fillRect(0,0,320,192);
 let seed=5;for(let i=0;i<200;i++){seed=(seed*16807)%2147483647;const x=seed%320;seed=(seed*16807)%2147483647;const y=seed%192;g.fillStyle=i%2?'#ffffff22':'#17192333';g.fillRect(x,y,2,1)}
 for(const [x,y,r] of [[40,112,9],[292,128,10],[270,20,7],[104,164,6],[190,152,5]]){g.fillStyle='#484a50';g.beginPath();g.ellipse(x,y,r,r*.7,0,0,7);g.fill();g.fillStyle='#aaa9a4';g.fillRect(x-r/2,y-r/2,r,1)}
 g.fillStyle='#45454a';g.fillRect(60,132,200,8);g.fillRect(156,112,8,24);g.fillStyle='#ffffff33';g.fillRect(60,132,200,1);
 for(const [x,y] of [[16,24],[16,64],[58,24],[58,64]]){box(x,y,32,22,'#9aa3c0');for(let j=0;j<4;j++){g.fillStyle='#2a4aa8';g.fillRect(x+2+j*7,y+2,6,18);g.fillStyle='#6f96f0';g.fillRect(x+2+j*7,y+2,6,1)}}
 box(96,84,22,16,'#3a3d4a');for(let i=0;i<3;i++){g.fillStyle='#f2d03a';g.fillRect(99+i*6,88,3,5)}
 box(224,32,64,40,'#8fc9d6');for(let r=0;r<3;r++)for(let j=0;j<6;j++){g.fillStyle=j%2?'#2f8f45':'#6fd08c';g.fillRect(228+j*10,38+r*10,5,5)}
 box(232,100,48,36,'#59627c');for(const x of [246,268]){g.fillStyle='#7b8aa8';g.beginPath();g.arc(x,118,8,0,7);g.fill()}g.fillStyle='#14141c';g.font='bold 7px monospace';g.fillText('O2',252,132);
 g.fillStyle='#ddd';g.fillRect(60,126,2,22);box(40,148,24,12,'#c9c9cf');
 g.fillStyle='#555';g.fillRect(203,148,3,14);g.fillStyle='#d9dde6';g.beginPath();g.arc(204,146,8,0,7);g.fill();
 g.fillStyle='#14141c';g.beginPath();g.arc(160,80,31,0,7);g.fill();g.fillStyle='#cfd3dc';g.beginPath();g.arc(160,80,29,0,7);g.fill();g.fillStyle='#5f86b8';g.beginPath();g.arc(160,80,12,0,7);g.fill();
 for(let i=0;i<S.shield;i++){const p=[[124,52],[188,52],[124,100],[188,100]][i];box(p[0],p[1],16,8,'#a39682')}
 g.fillStyle='#1f58b0';g.beginPath();g.arc(302,14,9,0,7);g.fill();g.fillStyle='#3f9e55';g.fillRect(297,10,5,3);g.fillRect(303,15,4,3);
 if(S.night){g.fillStyle='#080a2d88';g.fillRect(0,0,320,192)}
 if(S.storm){g.fillStyle='#ff6e2822';g.fillRect(0,0,320,192);for(let i=0;i<18;i++){g.fillStyle=i%2?'#ffd24a':'#ff7a3c';g.fillRect((t/8+i*31)%320,(t/3+i*37)%192,1,3)}}
 // Astronaut, drawn last so it stays visible over lighting and weather.
 g.fillStyle='#0005';g.fillRect(S.x-6,S.y+7,12,3);g.fillStyle='#e8ecf5';g.fillRect(S.x-5,S.y-3,10,11);g.fillStyle='#11131d';g.beginPath();g.arc(S.x,S.y-5,6,0,7);g.fill();g.fillStyle='#f2f5fb';g.beginPath();g.arc(S.x,S.y-5,5,0,7);g.fill();g.fillStyle='#f2a23a';g.fillRect(S.x-3,S.y-12,7,5);g.fillStyle='#9aa3c0';g.fillRect(S.x-4,S.y+7,3,4);g.fillRect(S.x+2,S.y+7,3,4);
}
function ui(){if(!S)return;$('hud').innerHTML=[['POWER',S.pow],['AIR',S.air],['FOOD',S.food],['DOSE',S.dose]].map(([n,v])=>`<div class="m"><b>${n}</b><span>${Math.round(v)}</span></div>`).join('');$('crew').textContent=`Day ${S.day}/12 · Crew time ${'●'.repeat(S.ap)}${'○'.repeat(3-S.ap)} · Science ${S.sci}/5`;$('banner').textContent=S.night?'Lunar night: battery power only.':S.storm?'Solar storm today! Stay inside.':'Quiet Sun: panels are charging.';$('acts').innerHTML=Object.entries(A).map(([k,a])=>`<button class="a" data-act="${k}" ${S.ap<1||S.pow<a.p||S.busy?'disabled':''}><b>${a.n}</b><br><small>Power −${a.p} · Crew time −1</small></button>`).join('');$('end').disabled=S.busy;$('end').textContent='Go to bed & end the day';}
function act(k){const a=A[k];if(!a||S.ap<1||S.pow<a.p||S.busy)return;S.ap--;S.pow-=a.p;if(k==='air')S.air=Math.min(100,S.air+(cfg.site==='crater'?24:14));if(k==='food')S.food=Math.min(100,S.food+12);if(k==='science'){S.sci++;S.dose+=S.storm?28:4}if(k==='shield')S.shield=Math.min(4,S.shield+1);if(k==='call'){S.tx=1;setTimeout(()=>{if(S){S.tx=0;$('log').textContent='Earth received your call. Tomorrow’s weather is uncertain.'}},1200)}$('log').textContent=`${a.n} complete.`;ui()}
$('acts').onclick=e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act)};
function endDay(){if(S.busy)return;S.dose+=2;S.air-=10;S.food-=8;S.pow-=3;if(S.pow<0){S.air-=12;S.pow=0}S.day++;S.ap=3;S.night=S.day%4===0;S.storm=Math.random()<(cfg.site==='ridge'?.18:.25);if(S.air<=0||S.food<=0||S.dose>=100||S.day>12){$('log').textContent=S.sci>=5?'Mission complete!':'Mission ended. Try a new balance of science and supplies.';S.busy=true;$('end').disabled=true}else{$('log').textContent='A new lunar day begins.'}ui()}
$('end').onclick=endDay;
function interact(){if(!S)return;if(S.scene==='in'){S.scene='out';S.x=160;S.y=130;return}if(Math.hypot(S.x-160,S.y-124)<28){S.scene='in';S.x=160;S.y=146;return}let nearest=Object.entries(A).sort((a,b)=>Math.hypot(S.x-a[1].x,S.y-a[1].y)-Math.hypot(S.x-b[1].x,S.y-b[1].y))[0];if(nearest&&Math.hypot(S.x-nearest[1].x,S.y-nearest[1].y)<36)act(nearest[0]);else $('hint').textContent='Move closer to a station.'}
$('use').onclick=interact;
const KM={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};addEventListener('keydown',e=>{if(!$('setup').classList.contains('hidden'))return;if(KM[e.key]){K[KM[e.key]]=1;e.preventDefault()}else if(e.key==='e'||e.key==='E'||e.key===' '){e.preventDefault();interact()}});addEventListener('keyup',e=>{if(KM[e.key])K[KM[e.key]]=0});document.querySelectorAll('#dp [data-d]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();K[b.dataset.d]=1};['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>K[b.dataset.d]=0))});
function loop(t){if(!S)return;if(!S.busy){const dx=(K.right?1:0)-(K.left?1:0),dy=(K.down?1:0)-(K.up?1:0),n=Math.hypot(dx,dy)||1;S.x=Math.max(10,Math.min(310,S.x+dx/n*1.6));S.y=Math.max(14,Math.min(178,S.y+dy/n*1.6));if(dx||dy)S.dir=dx?dx:dy}draw(t);requestAnimationFrame(loop)}
</script></body></html>
